name: Bootstrap Writer Runtime

on:
  push:
    paths:
      - '.github/workflows/bootstrap-writer-runtime.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout writer repo
        uses: actions/checkout@v4
        with:
          path: writer

      - name: Checkout kq-story source
        uses: actions/checkout@v4
        with:
          repository: kekaojip/kq-story
          ref: main
          path: source

      - name: Copy exact V1 runtime assets
        shell: bash
        run: |
          set -euo pipefail
          SRC="source/skills/story-long-write"
          DST="writer/skills/story-writer-runtime"
          mkdir -p "$DST/references" "$DST/scripts"

          for f in \
            anti-ai-writing.md \
            banned-words.md \
            dialogue-mastery.md \
            long-format.md \
            writing-craft.md \
            style-resolution.md \
            long-chapter-quality.md \
            genre-prose-cards.md \
            style-genre-modules.md
          do
            cp "$SRC/references/$f" "$DST/references/$f"
          done

          rm -rf "$DST/references/genre-prose-cards"
          cp -R "$SRC/references/genre-prose-cards" "$DST/references/genre-prose-cards"

          for f in \
            check-ai-patterns.js \
            check-degeneration.js \
            check-outline-copy.js \
            normalize-punctuation.js \
            style-whitelist.js
          do
            cp "$SRC/scripts/$f" "$DST/scripts/$f"
          done

      - name: Commit synchronized assets
        working-directory: writer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/story-writer-runtime/references skills/story-writer-runtime/scripts
          if git diff --cached --quiet; then
            echo "No runtime asset changes."
            exit 0
          fi
          git commit -m "sync exact writer runtime assets from kq-story"
          git push

# bootstrap trigger: v1
