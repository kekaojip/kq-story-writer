name: Cleanup Test Content
on:
  push:
    paths:
      - '.github/workflows/cleanup-test-content.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep runtime framework, remove test novel state
        shell: bash
        run: |
          set -euo pipefail
          rm -rf archive/* input/current/*
          find output/current -mindepth 1 -maxdepth 1 ! -name 'OUTPUT_CONTRACT.md' -exec rm -rf {} +
          mkdir -p archive input/current
          touch archive/.gitkeep input/current/.gitkeep
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "remove Rules Repairman writer test content" || exit 0
          git push
